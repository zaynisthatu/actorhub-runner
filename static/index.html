<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actor Hub</title>
<style>:root{--bg:#f5f6f8;--cd:#fff;--tx:#151922;--mu:#667085;--bd:#e2e5ec;--ac:#5548e8}
@media(prefers-color-scheme:dark){:root{--bg:#0d1016;--cd:#161a22;--tx:#e9ebf1;--mu:#9aa3b2;--bd:#262c38;--ac:#8f86ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}header{padding:12px 20px;background:var(--cd);border-bottom:1px solid var(--bd);font-weight:700}
main{max-width:980px;margin:0 auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card.c{cursor:pointer}.mu{color:var(--mu);font-size:13px}label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mu)}input,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer;margin:12px 8px 0 0}button.g{background:none;color:var(--ac);border:1px solid var(--bd)}
.tw{overflow-x:auto;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:10px;max-height:220px;overflow:auto;font-size:12px;white-space:pre-wrap}.s{font-weight:700}.FAILED,.TIMEOUT{color:#d92d20}.SUCCEEDED{color:#0f9d58}</style></head>
<body><header>⚡ Actor Hub <span class="mu">local</span></header><main id="m"></main>
<script>const $=s=>document.querySelector(s),m=$('#m'),j=(u,o)=>fetch(u,o).then(r=>r.json()),E=s=>String(s??'').replace(/[&<]/g,c=>c=='&'?'&amp;':'&lt;');let A=[],T;
async function home(){clearTimeout(T);A=await j('/api/actors');const R=await j('/api/runs');m.innerHTML='<h2>Actors</h2><div class="grid">'+A.map(a=>`<div class="card c" onclick="openA('${a.name}')"><div style="font-size:26px">${a.icon||''}</div><b>${a.title}</b><p class="mu">${E(a.description)}</p></div>`).join('')+'</div><h2>Recent runs</h2>'+(R.length?'<div class="card">'+R.map(r=>`<div><a href="#" onclick="poll('${r.id}');return false">${r.id}</a> · ${r.actor} · <span class="s ${r.status}">${r.status}</span></div>`).join('')+'</div>':'<p class="mu">No runs yet.</p>')}
function openA(n){const a=A.find(x=>x.name==n);m.innerHTML=`<button class="g" onclick="home()">← All actors</button><h2>${a.icon||''} ${a.title}</h2><p class="mu">${E(a.description)}</p><div class="card">`+Object.entries(a.input_schema).map(([k,f])=>`<label>${f.label}${f.required?' *':''}</label>${f.type=='text'?`<textarea id="f_${k}" rows="4">${E(f.default)}</textarea>`:`<input id="f_${k}" value="${E(f.default)}">`}`).join('')+`<button onclick="run('${n}')">▶ Start</button><span class="mu">timeout ${a.timeout_sec}s · ${a.memory}</span></div><div id="out"></div>`}
async function run(n){const a=A.find(x=>x.name==n),inp={};for(const[k,f]of Object.entries(a.input_schema))inp[k]=$('#f_'+k).value;const r=await fetch(`/api/actors/${n}/runs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(inp)});const d=await r.json();if(!r.ok)return alert(d.detail);poll(d.id)}
async function poll(id){clearTimeout(T);const r=await j('/api/runs/'+id);if(!$('#out'))m.innerHTML='<button class="g" onclick="home()">← Back</button><div id="out"></div>';const c=[...new Set(r.items.flatMap(Object.keys))];
$('#out').innerHTML=`<p>Run ${id} · <span class="s ${r.status}">${r.status}</span> · ${r.count} items</p><pre>${E(r.log)||'(no log yet)'}</pre>`+(r.count?`<a href="/api/runs/${id}/dataset.csv"><button class="g">CSV</button></a><a href="/api/runs/${id}/dataset.json"><button class="g">JSON</button></a><div class="tw"><table><tr>${c.map(x=>`<th>${x}</th>`).join('')}</tr>${r.items.slice(0,50).map(i=>'<tr>'+c.map(x=>`<td>${E(i[x])}</td>`).join('')+'</tr>').join('')}</table></div>`:'');if(r.status=='RUNNING')T=setTimeout(()=>poll(id),1200)}
home()</script></body></html>
